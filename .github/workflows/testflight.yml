# 사이 → TestFlight, without a Mac: GitHub's macOS machine builds the iOS app from the current site (index.html,
# models, runtime) and uploads it to App Store Connect. Run it from the Actions tab (Run workflow).
# Secrets (Settings → Secrets and variables → Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 text),
# APPLE_TEAM_ID. Signing is Apple's cloud signing through the App Store Connect API key (no certificate files here).
name: TestFlight
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are there
        run: |
          for k in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -n "${!k}" ] || { echo "::error::secret $k is missing"; exit 1; }; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::secret ASC_KEY_P8 is missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Web content → iOS project
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run www
          npx cap sync ios
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" app/ios/ExportOptions.plist
      - name: Archive (unsigned; Apple signs it in the next step)
        run: |
          VER=$(node -p "require('./app/package.json').version")
          BUILD=$((100 + ${{ github.run_number }}))
          echo "version $VER build $BUILD"
          xcodebuild -quiet -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Sign and upload to App Store Connect
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist app/ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Clean up the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
